<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAPUZ</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: sans-serif; 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-touch-callout: none; 
            outline: none;
        }

        input, textarea { 
            -webkit-user-select: auto; 
            -moz-user-select: auto; 
            -ms-user-select: auto; 
            user-select: auto; 
        }

        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; transition: background-color 0.5s; }
        
        .title { font-size: 42px; font-weight: bold; color: #34C759; margin-bottom: 50px; cursor: pointer; }
        
        .screen { display: none; width: 100%; max-width: 400px; flex-direction: column; align-items: center; }
        .screen.active { display: flex; }
        input { width: 100%; height: 50px; background-color: #2c2c2e; color: #ffffff; border: none; border-radius: 10px; padding: 0 15px; margin-bottom: 15px; font-size: 16px; }
        input::placeholder { color: #8e8e93; }
        
        textarea { width: 100%; min-height: 50px; background-color: #2c2c2e; color: #ffffff; border: none; border-radius: 10px; padding: 15px; font-size: 16px; resize: none; overflow: hidden; line-height: 1.4; }
        textarea::placeholder { color: #8e8e93; }

        button { width: 100%; height: 50px; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 15px; transition: background-color 0.2s; }
        .btn-primary { background-color: #34C759; color: white; }
        .btn-secondary { background-color: #2c2c2e; color: #34C759; }
        .btn-blue { background-color: #0A84FF; color: white; }
        .btn-danger { background-color: #ff3b30; color: white; }
        .btn-back { background: none; color: #8e8e93; font-size: 16px; margin-top: 10px; }

        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header-title { font-size: 24px; font-weight: bold; color: #34C759; }
        
        .avatar { width: 40px; height: 40px; background-color: #2c2c2e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; flex-shrink: 0; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-large { width: 100px; height: 100px; font-size: 50px; margin-bottom: 20px; }
        
        .empty-chats { color: #8e8e93; margin-top: 20px; text-align: center; width: 100%; }
        
        #chats-screen, #profile-screen, #user-profile-screen, #create-channel-screen { height: 100%; justify-content: flex-start; }

        .input-group { width: 100%; display: flex; align-items: center; margin-bottom: 15px; }
        .input-group label { width: 90px; color: #8e8e93; font-size: 16px; font-weight: bold; flex-shrink: 0; }
        .input-group input, .input-group textarea { margin-bottom: 0; flex: 1; }

        .search-container { width: 100%; margin-bottom: 20px; }
        .search-container input { margin-bottom: 0; background-color: #1c1c1e; }
        
        .search-results { width: 100%; display: flex; flex-direction: column; }
        .user-card { width: 100%; display: flex; align-items: center; padding: 10px; background-color: #1c1c1e; border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: transform 0.1s; }
        .user-card:active { transform: scale(0.98); }
        .user-card .avatar { margin-bottom: 0; margin-right: 15px; }
        .user-card-info { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
        
        .user-card-nick { font-weight: bold; font-size: 16px; color: #ffffff; display: flex; align-items: center; max-width: 100%; overflow: hidden; }
        .user-card-nick-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .verified-icon { width: 16px; height: 16px; margin-left: 5px; flex-shrink: 0; }
        
        .user-card-login { font-size: 14px; color: #8e8e93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-list { width: 100%; display: flex; flex-direction: column; overflow-y: auto; flex: 1; }
        
        .unread-badge { background-color: #34C759; color: white; border-radius: 50%; min-width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; padding: 0 6px; margin-top: 4px; }

        #dialog-screen { height: 100%; justify-content: flex-start; padding-bottom: 10px; position: relative; }
        
        .chat-history { flex: 1; width: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px 0; margin-bottom: 10px; scroll-behavior: smooth; }
        .empty-history { text-align: center; color: #8e8e93; margin: auto; }
        
        .msg-bubble { max-width: 85%; padding: 10px 15px; border-radius: 15px; font-size: 15px; line-height: 1.4; word-wrap: break-word; cursor: pointer; transition: transform 0.2s, filter 0.2s; }
        .msg-sent { align-self: flex-end; background-color: #34C759; color: white; border-bottom-right-radius: 5px; }
        .msg-received { align-self: flex-start; background-color: #2c2c2e; color: white; border-bottom-left-radius: 5px; }

        .message-input-area { width: 100%; display: flex; gap: 10px; margin-top: auto; }
        .message-input-area input { margin-bottom: 0; flex: 1; }
        .message-input-area button { width: 60px; margin-bottom: 0; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }

        .channel-action-area { width: 100%; padding-top: 10px; margin-top: auto; }

        .beta-tag { font-size: 0.5em; margin-left: 2px; vertical-align: baseline; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
        .modal-box { background-color: #1c1c1e; border-radius: 15px; padding: 25px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .avatar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; margin-bottom: 20px; max-height: 60vh; overflow-y: auto; padding: 5px; }
        .avatar-grid img { width: 100%; aspect-ratio: 1; border-radius: 50%; cursor: pointer; object-fit: cover; transition: transform 0.1s; }
        .avatar-grid img:active { transform: scale(0.9); }

        .reaction-bar { display: flex; justify-content: flex-end; gap: 15px; font-size: 26px; margin-bottom: 15px; }
        .reaction-bar span { padding: 5px; cursor: pointer; transition: transform 0.1s; }
        .reaction-bar span:active { transform: scale(1.2); }
        .menu-action { padding: 15px; border-bottom: 1px solid #3a3a3c; color: white; font-size: 16px; cursor: pointer; text-align: left; }
        .menu-action:last-child { border-bottom: none; }
        .menu-action:active { background-color: #2c2c2e; }

        .status-dot { border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .status-dot-header { width: 10px; height: 10px; }
        .status-dot-list { width: 5.5px; height: 5.5px; }
        .status-online { background-color: #34C759; }
        .status-offline { background-color: #ff3b30; }

        @keyframes flashHighlight {
            0% { filter: brightness(1.5); transform: scale(1.02); box-shadow: 0 0 15px rgba(52, 199, 89, 0.5); }
            50% { filter: brightness(1.5); transform: scale(1.02); box-shadow: 0 0 15px rgba(52, 199, 89, 0.5); }
            100% { filter: brightness(1); transform: scale(1); box-shadow: none; }
        }
        .highlight-msg { animation: flashHighlight 1.5s ease-out; z-index: 10; position: relative; }

        .receipt-circle { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 4px; vertical-align: middle; }
        .receipt-unread { border: 1.5px solid rgba(255, 255, 255, 0.6); background-color: transparent; }
        .receipt-read { background-color: #ffffff; border: 1.5px solid #ffffff; }

        @keyframes blink { 50% { opacity: 0.3; } }
        .rec-dot { display: inline-block; width: 10px; height: 10px; background-color: #ff3b30; border-radius: 50%; margin-right: 8px; animation: blink 1s infinite; }
        
        .voice-player {
            display: flex;
            align-items: center;
            width: 240px;
            padding: 2px 0;
        }
        .voice-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.1s;
        }
        .voice-btn:active { transform: scale(0.95); }
        
        .msg-sent .voice-btn { background-color: #ffffff; color: #34C759; }
        .msg-received .voice-btn { background-color: #34C759; color: #ffffff; }

        .voice-progress-container {
            flex: 1;
            padding: 0 12px;
            display: flex;
            align-items: center;
            height: 20px;
            cursor: pointer;
        }
        .voice-progress {
            width: 100%;
            height: 3px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 2px;
            position: relative;
            pointer-events: none;
        }
        .msg-received .voice-progress { background-color: rgba(255, 255, 255, 0.15); }
        
        .voice-progress-fill {
            height: 100%;
            background-color: #ffffff;
            border-radius: 2px;
            width: 0%;
            position: absolute;
            left: 0;
        }
        .msg-received .voice-progress-fill { background-color: #34C759; }
        
        .voice-progress-fill::after {
            content: '';
            position: absolute;
            right: -5px;
            top: -3.5px;
            width: 10px;
            height: 10px;
            background-color: inherit;
            border-radius: 50%;
        }

        .voice-time {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            min-width: 32px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        /* Жуткий режим хакерской атаки */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }
        @keyframes matrixBg {
            0% { background-color: #1a0000; }
            50% { background-color: #330000; }
            100% { background-color: #1a0000; }
        }
        .hacked-mode {
            animation: matrixBg 2s infinite, glitch 0.2s infinite;
        }
        .hacked-mode .msg-sent, .hacked-mode .msg-received {
            background-color: #ff0000 !important;
            color: #ffff00 !important;
            border: 2px dashed #00ff00;
            font-weight: bold;
        }
        .hacked-alert {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 0, 0.2);
            z-index: 9999;
            pointer-events: none;
            display: none;
            box-shadow: inset 0 0 100px #ff0000;
        }

    </style>
</head>
<body>

    <div class="hacked-alert" id="hacked-overlay"></div>
    <div class="title" id="main-app-title" onclick="unlockTester()">PAPUZ<span class="beta-tag">BETA</span></div>

    <div id="home-screen" class="screen active">
        <button class="btn-primary" onclick="showScreen('login-screen')">Войти</button>
        <button class="btn-secondary" onclick="showScreen('register-screen')">Регистрация</button>
    </div>

    <div id="login-screen" class="screen">
        <input type="text" id="login-input" placeholder="Логин" maxlength="16">
        <input type="password" id="password-input" placeholder="Пароль">
        <button class="btn-primary" onclick="handleLogin()">Войти</button>
        <button class="btn-back" onclick="showScreen('home-screen')">Назад</button>
    </div>

    <div id="register-screen" class="screen">
        <input type="text" id="reg-login" placeholder="Придумайте логин" maxlength="16">
        <input type="password" id="reg-password" placeholder="Придумайте пароль">
        <input type="password" id="reg-confirm" placeholder="Повторите пароль">
        <button class="btn-primary" onclick="handleRegister()">Зарегистрироваться в PAPUZ</button>
        <button class="btn-back" onclick="showScreen('home-screen')">Назад</button>
    </div>

    <div id="chats-screen" class="screen">
        <div class="header">
            <div class="header-title">PAPUZ<span class="beta-tag">BETA</span></div>
            <div class="avatar" id="chats-avatar" onclick="showProfile()"><img src="https://i.postimg.cc/859cw46Z/Picsart-26-10-23-22-17-04-454.jpg" alt="avatar"></div>
        </div>
        
        <div class="search-container">
            <input type="text" id="user-search" placeholder="Поиск по логину..." oninput="searchUsers()">
        </div>
        
        <div id="search-results" class="search-results"></div>
        
        <div id="chat-list" class="chat-list">
            <div class="empty-chats">У вас пока нет чатов</div>
        </div>
    </div>

    <div id="chat-menu-modal" class="modal" onclick="closeChatMenu(event)">
        <div class="modal-box" onclick="event.stopPropagation()" style="padding: 15px; padding-bottom: 5px; text-align: left;">
            <div class="menu-action" id="chat-menu-pin-btn" onclick="togglePinChat()">Закрепить</div>
            <div class="menu-action" style="text-align: center; color: #8e8e93;" onclick="closeChatMenu()">Отмена</div>
        </div>
    </div>

    <div id="dialog-screen" class="screen">
        <div class="header" style="margin-bottom: 10px; display: flex; align-items: center;">
            <div style="width: 80px; flex-shrink: 0;">
                <button class="btn-back" style="margin: 0; text-align: left; padding: 0;" onclick="closeChat()">❮ Назад</button>
            </div>
            
            <div style="flex: 1; display: flex; justify-content: center; align-items: center; cursor: pointer; overflow: hidden;" onclick="showUserProfile()">
                <div style="display: flex; flex-direction: column; align-items: flex-end; justify-content: center; min-width: 0;">
                    <div class="header-title" id="dialog-header-name" style="font-size: 20px; color: white; margin: 0; display: flex; align-items: center;">Чат</div>
                    <div id="dialog-header-subs" style="font-size: 13px; color: #8e8e93; display: none; margin-top: 2px;"></div>
                </div>
                <div class="avatar" id="dialog-avatar" style="width: 35px; height: 35px; font-size: 16px; margin-left: 10px; flex-shrink: 0;"><img src="https://i.postimg.cc/859cw46Z/Picsart-26-10-23-22-17-04-454.jpg" alt="avatar"></div>
            </div>
            
            <div style="width: 80px; flex-shrink: 0;"></div>
        </div>

        <div id="pinned-message-bar" style="display: none; width: 100%; background: rgba(44, 44, 46, 0.9); padding: 8px 15px; font-size: 14px; border-bottom: 1px solid #3a3a3c; position: relative;">
            <div onclick="handlePinnedBarClick()" style="cursor: pointer; width: calc(100% - 30px); padding-right: 25px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div style="color: #34C759; font-weight: bold; font-size: 13px; margin-bottom: 2px;">📌 Закрепленное сообщение</div>
                    <div id="pinned-counter" style="font-size: 11px; color: #8e8e93; font-weight: bold; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 10px; display: none;"></div>
                </div>
                <div id="pinned-message-text" style="color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
            </div>
            <div id="unpin-btn" onclick="unpinMessage(event)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 20px; color: #8e8e93; cursor: pointer; padding: 5px 10px;">✕</div>
        </div>
        
        <div id="chat-history" class="chat-history"></div>
        
        <div id="reply-preview-bar" style="display: none; width: 100%; background: #1c1c1e; padding: 10px; border-top-left-radius: 10px; border-top-right-radius: 10px; border-left: 3px solid #34C759; position: relative;">
            <div style="color: #34C759; font-weight: bold; font-size: 13px; margin-bottom: 3px;">Ответ:</div>
            <div id="reply-preview-text" style="color: #8e8e93; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 20px;"></div>
            <div onclick="cancelReply()" style="position: absolute; right: 10px; top: 10px; color: #8e8e93; font-size: 18px; font-weight: bold; cursor: pointer; padding: 5px;">✕</div>
        </div>

        <div class="message-input-area" id="message-input-area">
            <div id="recording-ui" style="display: none; flex: 1; align-items: center; justify-content: space-between; background-color: #2c2c2e; border-radius: 10px; padding: 0 15px; margin-bottom: 15px; height: 50px;">
                <div style="display: flex; align-items: center;">
                    <span class="rec-dot"></span>
                    <span id="rec-time" style="color: white; font-weight: bold; font-variant-numeric: tabular-nums; font-size: 16px;">0:00</span>
                </div>
                <div onclick="cancelRecording()" style="color: #8e8e93; font-size: 22px; cursor: pointer; padding: 0 10px;">✕</div>
            </div>
            
            <input type="text" id="message-input" placeholder="Сообщение..." onkeypress="handleKeyPress(event)" oninput="toggleInputButtons()">
            
            <button id="btn-send" class="btn-primary" style="display: none;" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
            <button id="btn-mic" class="btn-primary" onclick="toggleRecording()">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>
        </div>

        <div class="channel-action-area" id="channel-action-area" style="display: none;">
            <button id="btn-subscribe" class="btn-primary" style="margin-bottom: 0;" onclick="toggleSubscription()">Подписаться</button>
        </div>
    </div>

    <div id="message-menu-modal" class="modal" onclick="closeMessageMenu(event)">
        <div class="modal-box" onclick="event.stopPropagation()" style="padding: 15px; padding-bottom: 5px; text-align: left;">
            <div id="main-menu-options">
                <div class="reaction-bar">
                    <span onclick="addReaction('❤️')">❤️</span>
                    <span onclick="addReaction('🔥')">🔥</span>
                    <span onclick="addReaction('👍')">👍</span>
                    <span onclick="addReaction('👎')">👎</span>
                    <span onclick="addReaction('😎')">😎</span>
                    <span onclick="addReaction('🤬')">🤬</span>
                </div>
                <div class="menu-action" onclick="prepareReply()">Ответить</div>
                <div class="menu-action" id="menu-action-copy" onclick="copyMessage()">Скопировать</div>
                <div class="menu-action" id="menu-action-pin" onclick="pinMessage()">Закрепить</div>
                <div class="menu-action" style="color: #ff3b30;" onclick="showDeleteOptions()">Удалить</div>
            </div>
            
            <div id="delete-menu-options" style="display: none;">
                <div class="menu-action" style="color: #ff3b30; text-align: center; font-weight: bold;" id="btn-delete-everyone" onclick="deleteMessage('everyone')">Удалить у всех</div>
                <div class="menu-action" style="color: #ff3b30; text-align: center; font-weight: bold;" onclick="deleteMessage('me')">Удалить у меня</div>
                <div class="menu-action" style="text-align: center;" onclick="closeMessageMenu()">Отмена</div>
            </div>
        </div>
    </div>

    <div id="profile-screen" class="screen">
        <div class="header">
            <button class="btn-back" style="margin: 0; width: 80px; text-align: left;" onclick="showScreen('chats-screen')">❮ Назад</button>
            <div class="header-title" style="font-size: 20px; color: white; text-align: center; flex: 1;">Профиль</div>
            <div style="width: 80px; text-align: right;"><button class="btn-back" style="margin: 0; padding: 0; font-size: 22px; width: auto;" onclick="showVersionModal()">ⓘ</button></div>
        </div>
        <div class="avatar avatar-large" id="profile-avatar" onclick="openAvatarModal('user')"><img src="https://i.postimg.cc/859cw46Z/Picsart-26-10-23-22-17-04-454.jpg" alt="avatar"></div>
        <div class="input-group">
            <label>Ник</label>
            <div style="display:flex; flex:1; align-items:center;">
                <input type="text" id="profile-nick" placeholder="Никнейм" maxlength="26" style="margin-bottom:0; flex:1;">
                <span id="profile-badges" style="margin-left: -25px; margin-right: 10px; z-index: 1; display:flex; align-items:center;"></span>
            </div>
        </div>
        <div class="input-group"><label>Логин</label><input type="text" id="profile-login" readonly style="color: #8e8e93;"></div>
        <div class="input-group" style="align-items: flex-start;"><label style="margin-top: 15px;">Описание</label><textarea id="profile-bio" placeholder="О себе" maxlength="120" oninput="this.style.height = '50px'; this.style.height = this.scrollHeight + 'px'"></textarea></div>
        <button id="btn-create-channel" class="btn-blue" onclick="showScreen('create-channel-screen')" style="display: none; margin-top: 10px;">📢 Создать канал</button>
        <button class="btn-primary" onclick="saveProfile()" style="margin-top: 10px;">Сохранить</button>
        <button class="btn-secondary" onclick="logout()">Выйти</button>
    </div>

    <div id="create-channel-screen" class="screen">
        <div class="header">
            <button class="btn-back" style="margin: 0; width: 80px; text-align: left;" onclick="showScreen('profile-screen')">❮ Назад</button>
            <div class="header-title" style="font-size: 20px; color: white; text-align: center; flex: 1;">Новый канал</div><div style="width: 80px;"></div>
        </div>
        <div class="avatar avatar-large" id="channel-create-avatar" onclick="openAvatarModal('channel')"><img src="https://i.postimg.cc/859cw46Z/Picsart-26-10-23-22-17-04-454.jpg" alt="avatar"></div>
        <div class="input-group"><label>Имя</label><input type="text" id="channel-name" placeholder="Название канала" maxlength="26"></div>

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        window.formatTimeFriendly = function(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const now = new Date();
            const isToday = d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            
            const h = d.getHours().toString().padStart(2, '0');
            const m = d.getMinutes().toString().padStart(2, '0');
            
            if (isToday) {
                return `${h}:${m}`;
            } else {
                const day = d.getDate().toString().padStart(2, '0');
                const month = (d.getMonth() + 1).toString().padStart(2, '0');
                return `${day}.${month}`;
            }
        }

        globalAudio.addEventListener('timeupdate', () => {

            const fill = document.getElementById('fill-' + currentPlayingId);

                let dur = globalAudio.duration;

                fill.style.width = Math.min(percent, 100) + '%';
                
                const currentSec = Math.floor(globalAudio.currentTime);

                const s = currentSec % 60;
                timeLabel.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;

        });

        window.togglePlay = function(e, msgId, url, durAttr) {
            e.stopPropagation();
            if (currentPlayingId && currentPlayingId !== msgId) {
                const oldBtn = document.querySelector(`#player-${currentPlayingId} .voice-btn`);
                if (oldBtn) {
                    oldBtn.querySelector('.icon-play').style.display = 'block';
                    oldBtn.querySelector('.icon-pause').style.display = 'none';
                    oldBtn.classList.remove('playing');
                }
                const oldFill = document.getElementById('fill-' + currentPlayingId);
                if (oldFill) oldFill.style.width = '0%';
                
                const oldTime = document.getElementById('time-' + currentPlayingId);
                if (oldTime) {
                    const m = Math.floor(currentAudioDuration / 60);
                    const s = currentAudioDuration % 60;
                    oldTime.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                }
                globalAudio.pause();
            }

            const btn = document.querySelector(`#player-${msgId} .voice-btn`);
            const playIcon = btn.querySelector('.icon-play');
            const pauseIcon = btn.querySelector('.icon-pause');
            currentAudioDuration = durAttr || 1;
            
            if (currentPlayingId === msgId) {
                if (globalAudio.paused) {
                    globalAudio.play();
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    btn.classList.add('playing');
                } else {
                    globalAudio.pause();
                    playIcon.style.display = 'block';
                    pauseIcon.style.display = 'none';
                    btn.classList.remove('playing');
                }
            } else {
                globalAudio.src = url;
                globalAudio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                btn.classList.add('playing');
                currentPlayingId = msgId;
            }
        }

        window.seekAudio = function(e, msgId, durAttr) {
            e.stopPropagation();
            if (currentPlayingId !== msgId) return; 
            
            let dur = globalAudio.duration;
            if (!dur || dur === Infinity) dur = currentAudioDuration;

            const progressBar = e.currentTarget;
            const rect = progressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = Math.max(0, Math.min(1, clickX / rect.width)); 
            
            globalAudio.currentTime = percent * dur;
        }

        window.handleRegister = async function() {
            const login = document.getElementById('reg-login').value.trim();
            const pass = document.getElementById('reg-password').value;
            const confirmVal = document.getElementById('reg-confirm').value;

            if (!login || !pass) return showCustomAlert('Заполните все поля');
            
            if (!testerMode) {
                if (login.toLowerCase() === 'oleg') return showCustomAlert('Логин "oleg" недопустим');
                if (login.length < 3) return showCustomAlert('Логин должен содержать минимум 3 символа');
                const loginRegex = /^[a-zA-Z0-9_]+$/;
                if (!loginRegex.test(login)) return showCustomAlert('Логин может состоять только из английских букв, цифр и нижнего подчеркивания');
                if (login.startsWith('_')) return showCustomAlert('Логин не может начинаться с нижнего подчеркивания');
                if (!/[a-zA-Z]/.test(login)) return showCustomAlert('Логин должен содержать хотя бы одну букву');
                if (pass.length < 6) return showCustomAlert('Пароль должен содержать минимум 6 символов');
            }

            if (pass !== confirmVal) return showCustomAlert('Пароли не совпадают');
            
            const snapshot = await get(child(ref(db), 'users/' + login));
            if (snapshot.exists()) return showCustomAlert('Ошибка: Логин уже занят');

            const newUser = { 
                password: pass, nickname: login, bio: '', avatar: defaultAvatarUrl, 
                joinedChannels: { 'papuz_news': true }, verified: (login.toLowerCase() === 'papuz')
            };

            await set(ref(db, 'users/' + login), newUser);

            askNotificationPermission();

        window.handleLogin = async function() {
            const login = document.getElementById('login-input').value.trim();
            const pass = document.getElementById('password-input').value;
            if (!login || !pass) return showCustomAlert('Введите логин и пароль');
            
            if (Object.keys(users).length === 0) {
                try {
                    const snap = await get(ref(db, 'users'));
                    if (snap.exists()) users = snap.val();
                } catch (e) {
                    return showCustomAlert('Ошибка подключения к базе данных. Проверьте интернет или VPN.');
                }
            }

            if (users[login] && users[login].password === pass) {
                if (users[login].banned) {
                    return showCustomAlert('Этот аккаунт заблокирован администратором.');
                }

                currentUser = login; 
                localStorage.setItem('papuz_login', login);
                localStorage.setItem('papuz_pass', pass);
                if (currentUser.toLowerCase() === 'papuz') { set(ref(db, 'users/' + currentUser + '/verified'), true); }
                
                askNotificationPermission();

        function getChatId(user1, user2) {
            if (users[user1] && users[user1].isChannel) return 'channel_' + user1;
            if (users[user2] && users[user2].isChannel) return 'channel_' + user2;
            return [user1, user2].sort().join('_');
        }

        function renderActiveChats() {
            if (!currentUser || !users[currentUser]) return;
            const chatList = document.getElementById('chat-list');
            chatList.innerHTML = '';
            chatList.style.display = 'flex';
            
            let activeChatsArray = [];
            let activePartners = new Set();
            
            const myData = users[currentUser];
            if (myData.joinedChannels) {
                Object.keys(myData.joinedChannels).forEach(channelLogin => {
                    if (users[channelLogin]) {
                        if (users[channelLogin].banned && currentUser.toLowerCase() !== 'papuz') return;
                        activePartners.add(channelLogin);
                    }
                });
            }
            
            for (let chatId in chats) {
                if (chatId.includes(currentUser) && !chatId.startsWith('channel_')) {
                    const usersInChat = chatId.split('_');
                    const partnerLogin = (usersInChat[0] === currentUser) ? usersInChat[1] : usersInChat[0];
                    if (users[partnerLogin]) {
                        if (users[partnerLogin].banned && currentUser.toLowerCase() !== 'papuz') continue;
                        activePartners.add(partnerLogin);
                    }
                }
            }

            if (activePartners.size === 0) {
                chatList.innerHTML = '<div class="empty-chats">У вас пока нет чатов</div>';
                return;
            }

            let pinnedChats = (users[currentUser] && users[currentUser].pinnedChats) || {};

            activePartners.forEach(partnerLogin => {
                const partner = users[partnerLogin];
                if (!partner) return;
                
                const chatId = getChatId(currentUser, partnerLogin);
                const chatMsgs = chats[chatId] || {};
                
                const messages = Object.keys(chatMsgs)
                    .filter(k => k !== 'pinned')
                    .map(k => chatMsgs[k])
                    .filter(msg => !(msg.deletedFor && msg.deletedFor[currentUser]));
                
                let lastMsgHtml = `<span style="color: #8e8e93;">Сообщений нет</span>`;
                let time = 0;
                
                if (messages.length > 0) {
                    messages.sort((a, b) => a.timestamp - b.timestamp);
                    const lastMsgObj = messages[messages.length - 1];
                    time = lastMsgObj.timestamp || 0;
                    
                    let displayTxt = lastMsgObj.audioUrl ? `${svgMicSmall}Голосовое сообщение` : escapeHtml(lastMsgObj.text);

                    if (lastMsgObj.sender === currentUser) {
                        let receiptHtml = '';
                        if (!partner.isChannel) {
                            let receiptClass = lastMsgObj.read ? 'receipt-read' : 'receipt-unread';
                            receiptHtml = `<span class="receipt-circle ${receiptClass}" style="width: 10px; height: 10px; border-width: 1.5px; margin: 0 4px 0 0; position: relative; top: -1px;"></span>`;
                        }
                        lastMsgHtml = `${receiptHtml}Вы: ${displayTxt}`;
                    } else {
                        lastMsgHtml = displayTxt;
                    }
                }
                
                let unreadCount = 0;
                if (!partner.isChannel && messages.length > 0) {
                    messages.forEach(msg => { if (msg.sender !== currentUser && !msg.read) unreadCount++; });
                }
                
                let isPinned = !!pinnedChats[partnerLogin];
                let pinIcon = isPinned ? '<span style="font-size: 14px; margin-left: 5px;">📌</span>' : '';
                let pinTime = isPinned ? pinnedChats[partnerLogin] : 0;

                let isOnline = (partnerLogin.toLowerCase() === 'papuz') ? true : (partner.isChannel ? false : !!partner.online);
                let statusDotHtml = window.getStatusHtml(partnerLogin, partner.isChannel, isOnline, 'list');

                let badgeHtml = unreadCount > 0 ? `<div class="unread-badge">${unreadCount}</div>` : '';
                let timeStr = window.formatTimeFriendly(time);
                
                let avatarHtml = getAvatarHTML(partner.avatar);
                let partnerName = partner.nickname || partnerLogin;
                let displayName = partner.isChannel ? `📢 ${partnerName}` : partnerName;

                activeChatsArray.push({
                    isPinned: isPinned,
                    pinTime: pinTime,
                    time: time,
                    html: `
                        <div class="user-card" 
                            onclick="handleChatClick(event, '${partnerLogin}')"
                            oncontextmenu="event.preventDefault(); openChatMenu('${partnerLogin}')"
                            ontouchstart="startChatPress(event, '${partnerLogin}')"
                            ontouchend="cancelChatPress()"
                            ontouchmove="cancelChatPress()"
                            onmousedown="startChatPress(event, '${partnerLogin}')"
                            onmouseup="cancelChatPress()"
                            onmouseleave="cancelChatPress()">
                            
                            <div class="avatar">${avatarHtml}</div>
                            <div class="user-card-info">
                                <span class="user-card-nick">
                                    <span class="user-card-nick-text">${escapeHtml(displayName)}</span>
                                    ${getVerifiedHtml(partner.verified)}
                                    ${getFakeHtml(partner.isFake)}
                                    ${currentUser.toLowerCase() === 'papuz' ? getBannedHtml(partner.banned) : ''}
                                    ${pinIcon}
                                    ${statusDotHtml}
                                </span>
                                <span class="user-card-login">${lastMsgHtml}</span>
                            </div>
                            
                            <div style="display: flex; flex-direction: column; align-items: flex-end; margin-left: 10px; flex-shrink: 0;">
                                <span style="font-size: 12px; color: #8e8e93; margin-bottom: ${badgeHtml ? '4px' : '0'};">${timeStr}</span>
                                ${badgeHtml}
                            </div>
                        </div>
                    `
                });
            });
            
            activeChatsArray.sort((a, b) => {
                if (a.isPinned && !b.isPinned) return -1;
                if (!a.isPinned && b.isPinned) return 1;
                if (a.isPinned && b.isPinned) return b.pinTime - a.pinTime; 
                return b.time - a.time; 
            });

            activeChatsArray.forEach(item => { chatList.innerHTML += item.html; });
        }

                    let userName = user.nickname || login;

                    card.ontouchmove = cancelChatPress;
                    card.onmousedown = function(e) { startChatPress(e, login); };

                    card.onmouseleave = cancelChatPress;

                    card.innerHTML = `
                        <div class="avatar">${avatarHtml}</div>
                        <div class="user-card-info">
                            <span class="user-card-nick"><span class="user-card-nick-text">${escapeHtml(displayName)}</span>${getVerifiedHtml(user.verified)}${getFakeHtml(user.isFake)}${currentUser.toLowerCase() === 'papuz' ? getBannedHtml(user.banned) : ''}${statusDotHtml}</span>
                            <span class="user-card-login">@${login}</span>
                        </div>
                    `;
                    resultsContainer.appendChild(card);
                }
            }
            if (!found) resultsContainer.innerHTML = '<div class="empty-chats">Ничего не найдено</div>';
        }

        window.openChat = async function(partnerLogin) {
            currentChatPartner = partnerLogin;
            updateChatHeader(partnerLogin);
            
            const partner = users[partnerLogin];
            cancelReply(); 
            document.getElementById('dialog-avatar').innerHTML = getAvatarHTML(partner.avatar); 
            
            const subsElement = document.getElementById('dialog-header-subs');

            if (partner.isChannel) {
                const subCount = partner.subscribers ? Object.keys(partner.subscribers).length : 0;
                let subText = 'подписчиков';
                const lastDigit = subCount % 10;
                const lastTwo = subCount % 100;
                if (lastDigit === 1 && lastTwo !== 11) subText = 'подписчик';
                else if ([2, 3, 4].includes(lastDigit) && ![12, 13, 14].includes(lastTwo)) subText = 'подписчика';
                
                subsElement.innerText = `${subCount} ${subText}`;
                subsElement.style.display = 'block';

                const myJoined = users[currentUser].joinedChannels || {};
                const isSubbed = !!myJoined[partnerLogin];
                
                if (partner.owner === currentUser) {
                    document.getElementById('message-input-area').style.display = 'flex';
                    document.getElementById('channel-action-area').style.display = 'none';
                } else if (partnerLogin === 'papuz_news') {
                    document.getElementById('message-input-area').style.display = 'none';
                    document.getElementById('channel-action-area').style.display = 'none';
                } else {
                    document.getElementById('message-input-area').style.display = 'none';
                    document.getElementById('channel-action-area').style.display = 'flex';
                    const subBtn = document.getElementById('btn-subscribe');
                    if (isSubbed) {
                        subBtn.className = 'btn-secondary';
                        subBtn.innerText = 'Отписаться';
                    } else {
                        subBtn.className = 'btn-primary';
                        subBtn.innerText = 'Подписаться';
                    }
                }
            } else {
                subsElement.style.display = 'none';
                document.getElementById('message-input-area').style.display = 'flex';
                document.getElementById('channel-action-area').style.display = 'none';
            }
            
            const chatId = getChatId(currentUser, partnerLogin);
            if (chats[chatId]) {
                let updatesObj = {};
                let hasChanges = false;
                let hasUnread = false;

                for (let msgId in chats[chatId]) {
                    if (msgId === 'pinned') continue;
                    let msg = chats[chatId][msgId];
                    if (msg.deletedFor && msg.deletedFor[currentUser]) continue;
                    
                    if (partner.isChannel) {
                        if (!msg.views || !msg.views[currentUser]) {
                            updatesObj[`chats/${chatId}/${msgId}/views/${currentUser}`] = true;
                            hasChanges = true;
                        }
                    } else {
                        if (msg.sender !== currentUser && !msg.read) {
                            updatesObj[`chats/${chatId}/${msgId}/read`] = true;
                            hasChanges = true;
                            hasUnread = true;
                        }
                    }
                }
                
                if (hasChanges) {
                    update(ref(db), updatesObj);
                    if (hasUnread) renderActiveChats();
                }
            }
            
            renderMessages();
            showScreen('dialog-screen');
            toggleInputButtons();
        }

        window.toggleSubscription = async function() {
            if (!currentChatPartner || currentChatPartner === 'papuz_news') return;
            const channelLogin = currentChatPartner;
            
            const myJoinedRef = ref(db, `users/${currentUser}/joinedChannels/${channelLogin}`);
            const subRef = ref(db, `users/${channelLogin}/subscribers/${currentUser}`);
            
            const myJoined = users[currentUser].joinedChannels || {};
            const isSubbed = !!myJoined[channelLogin];
            
            if (isSubbed) {
                await set(myJoinedRef, null);
                await set(subRef, null);
                if (users[currentUser].joinedChannels) delete users[currentUser].joinedChannels[channelLogin];
                if (users[channelLogin].subscribers) delete users[channelLogin].subscribers[currentUser];
            } else {
                await set(myJoinedRef, true);
                await set(subRef, true);
                if (!users[currentUser].joinedChannels) users[currentUser].joinedChannels = {};
                users[currentUser].joinedChannels[channelLogin] = true;
                if (!users[channelLogin].subscribers) users[channelLogin].subscribers = {};
                users[channelLogin].subscribers[currentUser] = true;
            }
            openChat(channelLogin);
        }

        window.closeChat = function() {
            currentChatPartner = null;
            document.getElementById('user-search').value = '';
            document.getElementById('search-results').innerHTML = '';
            renderActiveChats();
            showScreen('chats-screen');
        }

        function renderMessages() {
            const history = document.getElementById('chat-history');
            history.innerHTML = '';
            
            const chatId = getChatId(currentUser, currentChatPartner);
            const chatMsgs = chats[chatId] || {};
            
            checkHackedState(chatId);

            const pinnedData = chatMsgs['pinned'];
            currentPinnedList = [];
            
            if (pinnedData) {
                if (typeof pinnedData.text === 'string') {
                    currentPinnedList.push({ id: pinnedData.id, text: pinnedData.text, timestamp: pinnedData.timestamp });
                } else {
                    for (let key in pinnedData) {
                        currentPinnedList.push({ id: key, text: pinnedData[key].text, timestamp: pinnedData[key].timestamp });
                    }
                }
                currentPinnedList.sort((a, b) => b.timestamp - a.timestamp);
            }
            
            updatePinnedBarUI();

            let messages = [];
            for (let key in chatMsgs) {
                if (key !== 'pinned') {
                    let msg = chatMsgs[key];
                    if (msg.deletedFor && msg.deletedFor[currentUser]) continue; 
                    msg.id = key;
                    messages.push(msg);
                }
            }

            if (messages.length === 0) {
                history.innerHTML = '<div class="empty-history">Здесь будут ваши сообщения</div>';
                return;
            }

            messages.sort((a, b) => a.timestamp - b.timestamp);
            const partner = users[currentChatPartner];
            const isChannel = partner && partner.isChannel;

            messages.forEach(msg => {
                const bubble = document.createElement('div');
                bubble.id = 'msg-' + msg.id; 
                const isSent = msg.sender === currentUser;
                bubble.className = 'msg-bubble ' + (isSent ? 'msg-sent' : 'msg-received');
                
                let innerHTML = '';
                
                if (msg.replyTo) {
                    innerHTML += `<div style="background: rgba(0,0,0,0.2); border-left: 3px solid ${isSent ? '#ffffff' : '#34C759'}; padding: 5px 8px; font-size: 13px; margin-bottom: 5px; border-radius: 4px; color: ${isSent ? '#ffffff' : '#d1d1d6'}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(msg.replyTo)}</div>`;
                }
                
                if (msg.audioUrl) {
                    let durText = "0:00";
                    let durAttr = 1;
                    if (msg.duration) {
                        durAttr = msg.duration;
                        const m = Math.floor(msg.duration / 60);
                        const s = msg.duration % 60;
                        durText = `${m}:${s < 10 ? '0' : ''}${s}`;
                    }

                    innerHTML += `
                        <div class="voice-player" id="player-${msg.id}">
                            <button class="voice-btn" 
                                ontouchstart="event.stopPropagation()" 
                                onmousedown="event.stopPropagation()" 
                                oncontextmenu="event.stopPropagation()" 
                                onclick="togglePlay(event, '${msg.id}', '${msg.audioUrl}', ${durAttr})">
                                <svg class="icon-play" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="margin-left: 3px;"><path d="M8 5v14l11-7z"/></svg>
                                <svg class="icon-pause" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                            </button>
                            <div class="voice-progress-container">
                                <div class="voice-progress" 
                                    ontouchstart="event.stopPropagation()" 
                                    onmousedown="event.stopPropagation()" 
                                    oncontextmenu="event.stopPropagation()" 
                                    onclick="seekAudio(event, '${msg.id}', ${durAttr})">
                                    <div class="voice-progress-fill" id="fill-${msg.id}"></div>
                                </div>
                            </div>
                            <div class="voice-time" id="time-${msg.id}">${durText}</div>
                        </div>
                    `;
                } else if (msg.text) {
                    innerHTML += escapeHtml(msg.text);
                }

                if (msg.reactions) {
                    let rxHtml = '<div style="display:flex; gap: 4px; margin-top: 5px; flex-wrap: wrap;">';
                    let rxCounts = {};
                    Object.values(msg.reactions).forEach(emoji => {
                        rxCounts[emoji] = (rxCounts[emoji] || 0) + 1;
                    });
                    for (let emoji in rxCounts) {
                        rxHtml += `<div style="background: rgba(255,255,255,0.1); border-radius: 10px; padding: 2px 6px; font-size: 12px;">${emoji} ${rxCounts[emoji] > 1 ? rxCounts[emoji] : ''}</div>`;
                    }
                    rxHtml += '</div>';
                    innerHTML += rxHtml;
                }

                let metaHtml = `<div style="display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 5px;">`;
                metaHtml += `<span>${window.formatTimeFriendly(msg.timestamp)}</span>`;

                if (isChannel) {
                    const viewCount = msg.views ? Object.keys(msg.views).length : 1;
                    metaHtml += `<span style="display:flex; align-items:center; gap:2px; margin-left: 2px;">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        ${viewCount}
                    </span>`;
                } else if (isSent) {
                    if (msg.read) {
                        metaHtml += `<span class="receipt-circle receipt-read"></span>`;
                    } else {
                        metaHtml += `<span class="receipt-circle receipt-unread"></span>`;
                    }
                }
                metaHtml += `</div>`;

                bubble.innerHTML = innerHTML + metaHtml;

                let pressTimer;
                const menuText = msg.audioUrl ? "🎤 Голосовое сообщение" : msg.text;
                
                const startPress = (e) => {
                    if (e.type === 'mousedown' && e.button === 2) return; 
                    pressTimer = setTimeout(() => { openMessageMenu(msg.id, menuText, msg.sender, !!msg.audioUrl); }, 300);
                };
                const cancelPress = () => clearTimeout(pressTimer);

                bubble.oncontextmenu = (e) => { e.preventDefault(); openMessageMenu(msg.id, menuText, msg.sender, !!msg.audioUrl); };
                bubble.ontouchstart = startPress;
                bubble.ontouchend = cancelPress;
                bubble.ontouchmove = cancelPress;
                bubble.onmousedown = startPress;
                bubble.onmouseup = cancelPress;
                bubble.onmousemove = cancelPress;

                history.appendChild(bubble);
            });

            history.scrollTop = history.scrollHeight;
        }

        window.toggleInputButtons = function() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (text.length > 0) {
                document.getElementById('btn-send').style.display = 'flex';
                document.getElementById('btn-mic').style.display = 'none';
            } else {
                document.getElementById('btn-send').style.display = 'none';
                document.getElementById('btn-mic').style.display = 'flex';
            }
        }

        window.sendMessage = async function() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return; 

            const chatId = getChatId(currentUser, currentChatPartner);
            const msgRef = ref(db, 'chats/' + chatId);
            const newMsgRef = push(msgRef);
            
            let msgObj = {
                sender: currentUser,
                text: text,
                read: false,
                timestamp: Date.now()
            };

            const partner = users[currentChatPartner];
            if (partner && partner.isChannel) {
                msgObj.views = { [currentUser]: true };
            }

            if (replyingToText) {
                msgObj.replyTo = replyingToText;
                cancelReply();
            }

            await set(newMsgRef, msgObj);
            input.value = ''; 
            toggleInputButtons();
        }

        window.toggleRecording = async function() {
            if (isUploading) return;
            
            if (isRecording) {
                stopRecording(true);
                return;
            }
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };
                
                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(track => track.stop());
                    if (audioChunks.length === 0) return;
                    
                    isUploading = true;
                    const btnMic = document.getElementById('btn-mic');
                    btnMic.innerHTML = svgStop;
                    
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        const base64AudioMessage = reader.result;
                        const finalDuration = recSeconds > 0 ? recSeconds : 1;
                        try {
                            await sendVoiceMessage(base64AudioMessage, finalDuration);
                        } catch(err) {
                            showCustomAlert("Ошибка отправки аудиосообщения.");
                        }
                        
                        isUploading = false;
                        btnMic.innerHTML = svgMic;
                        audioChunks = [];
                    };
                };
                
                mediaRecorder.start();
                isRecording = true;
                recSeconds = 0;
                
                document.getElementById('message-input').style.display = 'none';
                document.getElementById('recording-ui').style.display = 'flex';
                
                const btnMic = document.getElementById('btn-mic');
                btnMic.innerHTML = svgSend;
                btnMic.style.backgroundColor = '#0A84FF';
                
                updateRecTimeUI();
                recTimer = setInterval(() => {
                    recSeconds++;
                    updateRecTimeUI();
                    if (recSeconds >= MAX_REC_SECONDS) {
                        stopRecording(true);
                    }
                }, 1000);
                
            } catch(e) {
                showCustomAlert('Для записи ГС разрешите приложению доступ к микрофону.');
            }
        }
        
        window.stopRecording = function(send) {
            if (!isRecording) return;
            clearInterval(recTimer);
            isRecording = false;
            
            document.getElementById('message-input').style.display = 'block';
            document.getElementById('recording-ui').style.display = 'none';
            
            const btnMic = document.getElementById('btn-mic');
            btnMic.innerHTML = svgMic;
            btnMic.style.backgroundColor = '#34C759';
            
            if (!send) {
                audioChunks = []; 
                mediaRecorder.stop();
            } else {
                mediaRecorder.stop(); 
            }
        }
        
        window.cancelRecording = function() {
            stopRecording(false);
        }
        
        function updateRecTimeUI() {
            const m = Math.floor(recSeconds / 60);
            const s = recSeconds % 60;
            document.getElementById('rec-time').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }
        
        window.sendVoiceMessage = async function(base64Audio, duration) {
            const chatId = getChatId(currentUser, currentChatPartner);
            const msgRef = ref(db, 'chats/' + chatId);
            const newMsgRef = push(msgRef);
            
            let msgObj = {
                sender: currentUser,
                audioUrl: base64Audio,
                duration: duration,
                read: false,
                timestamp: Date.now()
            };

            const partner = users[currentChatPartner];
            if (partner && partner.isChannel) {
                msgObj.views = { [currentUser]: true };
            }

            if (replyingToText) {
                msgObj.replyTo = replyingToText;
                cancelReply();
            }

            await set(newMsgRef, msgObj);
        }

        window.handleKeyPress = function(e) { if (e.key === 'Enter') sendMessage(); }

        window.showProfile = function() {
            document.getElementById('profile-nick').value = users[currentUser].nickname || currentUser;
            document.getElementById('profile-login').value = currentUser; 
            document.getElementById('profile-badges').innerHTML = getVerifiedHtml(users[currentUser].verified) + getFakeHtml(users[currentUser].isFake);
            
            const bioField = document.getElementById('profile-bio');
            bioField.value = users[currentUser].bio || '';
            
            const createBtn = document.getElementById('btn-create-channel');
            if (currentUser.toLowerCase() === 'papuz') { createBtn.style.display = 'block'; } else { createBtn.style.display = 'none'; }
            
            showScreen('profile-screen');
            bioField.style.height = '50px';
            bioField.style.height = bioField.scrollHeight + 'px';
        }
        
        window.createChannel = async function() {
            const name = document.getElementById('channel-name').value.trim();
            const login = document.getElementById('channel-login').value.trim();
            const bio = document.getElementById('channel-bio').value.trim();

            if (!name || !login) return showCustomAlert('Введите имя и логин канала');
            const loginRegex = /^[a-zA-Z0-9_]+$/;
            if (!loginRegex.test(login)) return showCustomAlert('Логин может состоять только из английских букв, цифр и нижнего подчеркивания');
            if (users[login]) return showCustomAlert('Этот логин уже занят');

            const newChannel = { password: 'channel_reserved', nickname: name, bio: bio, avatar: tempChannelAvatar, isChannel: true, owner: currentUser, subscribers: { [currentUser]: true }, verified: false };
            
            await set(ref(db, 'users/' + login), newChannel);
            await set(ref(db, `users/${currentUser}/joinedChannels/${login}`), true);
            await set(ref(db, `chats/channel_${login}/msg1`), { sender: currentUser, text: 'Канал создан!', read: true, timestamp: Date.now(), views: { [currentUser]: true } });

            if (!users[currentUser].joinedChannels) users[currentUser].joinedChannels = {};
            users[currentUser].joinedChannels[login] = true;

            showCustomAlert('Канал успешно создан!', () => {
                document.getElementById('channel-name').value = '';
                document.getElementById('channel-login').value = '';
                document.getElementById('channel-bio').value = '';
                tempChannelAvatar = defaultAvatarUrl;
                document.getElementById('channel-create-avatar').innerHTML = getAvatarHTML(defaultAvatarUrl);
                
                showScreen('profile-screen');
                renderActiveChats();
            });
        }

        window.showUserProfile = function() {
            if (!currentChatPartner) return;
            const partner = users[currentChatPartner];
            document.getElementById('user-profile-avatar').innerHTML = getAvatarHTML(partner.avatar);
            let partnerName = partner.nickname || currentChatPartner;
            document.getElementById('user-profile-nick').value = partner.isChannel ? `📢 ${partnerName}` : partnerName;
            document.getElementById('user-profile-login').value = currentChatPartner;
            
            document.getElementById('user-profile-badges').innerHTML = getVerifiedHtml(partner.verified) + getFakeHtml(partner.isFake) + (currentUser.toLowerCase() === 'papuz' ? getBannedHtml(partner.banned) : '');
            
            const bioField = document.getElementById('user-profile-bio');
            bioField.value = partner.bio || 'Нет описания';

            const verifyBtn = document.getElementById('btn-verify-user');
            const fakeBtn = document.getElementById('btn-fake-user');
            const banBtn = document.getElementById('btn-ban-user');

            if (currentUser.toLowerCase() === 'papuz' && currentChatPartner.toLowerCase() !== 'papuz') {
                verifyBtn.style.display = 'block';
                verifyBtn.innerText = partner.verified ? 'Забрать галочку' : 'Выдать галочку';
                verifyBtn.className = partner.verified ? 'btn-secondary' : 'btn-blue';

                fakeBtn.style.display = 'block';
                fakeBtn.innerText = partner.isFake ? 'Убрать FAKE' : 'Выдать FAKE';
                fakeBtn.className = partner.isFake ? 'btn-secondary' : 'btn-danger';

                if (currentChatPartner !== 'papuz_news') {
                    banBtn.style.display = 'block';
                    banBtn.innerText = partner.banned ? 'Разблокировать' : 'Заблокировать';
                    if (partner.banned) {
                        banBtn.className = 'btn-secondary';
                        banBtn.style.color = '#ff3b30';
                    } else {
                        banBtn.className = 'btn-danger';
                        banBtn.style.color = 'white';
                    }
                } else {
                    banBtn.style.display = 'none';
                }
            } else {
                verifyBtn.style.display = 'none';
                fakeBtn.style.display = 'none';
                banBtn.style.display = 'none';
            }
            
            showScreen('user-profile-screen');
            bioField.style.height = '50px';
            bioField.style.height = bioField.scrollHeight + 'px';
        }

        window.toggleVerification = async function() {
            if (currentUser.toLowerCase() !== 'papuz') return;
            const partner = users[currentChatPartner];
            const newStatus = !partner.verified;
            await set(ref(db, `users/${currentChatPartner}/verified`), newStatus);
            partner.verified = newStatus;
            showUserProfile(); 
            updateChatHeader(currentChatPartner);
        }

        window.toggleFake = async function() {
            if (currentUser.toLowerCase() !== 'papuz') return;
            const partner = users[currentChatPartner];
            const newStatus = !partner.isFake;
            await set(ref(db, `users/${currentChatPartner}/isFake`), newStatus);
            partner.isFake = newStatus;
            showUserProfile(); 
            updateChatHeader(currentChatPartner);
        }

        window.toggleBan = async function() {
            if (currentUser.toLowerCase() !== 'papuz') return;
            const partner = users[currentChatPartner];
            const newStatus = !partner.banned;
            await set(ref(db, `users/${currentChatPartner}/banned`), newStatus);
            partner.banned = newStatus;
            showUserProfile();
            updateChatHeader(currentChatPartner);
        }

        window.saveProfile = async function() {
            const newNick = document.getElementById('profile-nick').value.trim();
            const newBio = document.getElementById('profile-bio').value.trim();
            if (!newNick) return showCustomAlert('Никнейм не может быть пустым!');
            await update(ref(db, 'users/' + currentUser), { nickname: newNick, bio: newBio });
            users[currentUser].nickname = newNick;
            users[currentUser].bio = newBio;
            showCustomAlert('Профиль сохранен!', () => {
                document.getElementById('user-search').value = '';
                document.getElementById('search-results').innerHTML = '';
                renderActiveChats();
                showScreen('chats-screen');
            });
        }

        window.logout = function() {
            showCustomConfirm("Вы уверены, что хотите выйти?", [
                {
                    text: "Выйти",
                    class: "btn-danger",
                    onClick: async () => {
                        if (currentUser) {
                            await set(ref(db, `users/${currentUser}/online`), false);
                        }
                        currentUser = null;
                        localStorage.removeItem('papuz_login');
                        localStorage.removeItem('papuz_pass');
                        showScreen('home-screen');
                    }
                },
                { text: "Отмена", class: "btn-primary" }
            ]);
        }
    </script>
</body>
</html>
